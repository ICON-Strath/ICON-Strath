<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratory</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: #222;
        }

        header {
            height: 70px;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #222;

            margin-left: 28px;

            font-size: 15px;
        }

        nav a:hover {
            color: #777;
        }

        .hero {
            height: 500px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            background: #f5f5f5;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 30px;

            color: #777;
            border-top: 1px solid #ddd;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        LAB
    </div>

    <nav>

        <a href="#">Home</a>
        <a href="#">Research</a>
        <a href="#">People</a>
        <a href="#">Publications</a>
        <a href="#">Projects</a>
        <a href="#">Facilities</a>
        <a href="#">News</a>
        <a href="#">Contact</a>

    </nav>

</header>


<section class="hero">

    <h1>Laboratory</h1>

    <p>
        Research · Innovation · Engineering
    </p>

</section>


<footer>

    © Laboratory

</footer>

</body>

</html>
